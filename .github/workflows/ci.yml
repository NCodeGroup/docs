name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # A required check must also report in a merge queue.
  merge_group:
    types: [checks_requested]
  # tag-release.yml runs this workflow before it tags a release (ADR-0026).
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request or a topic branch cancels the run it supersedes. A run for a default-branch commit or
# a merge queue entry is never cancelled: its group holds its commit SHA, because cancel-in-progress: false alone still
# lets a newer run in the same group cancel a pending one, which would leave that commit without a verdict.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'merge_group') && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'merge_group' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The decision index check compares the records with the default branch, so it needs every branch's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # npm ci installs exactly what package-lock.json names and fails when package.json disagrees with it, and
      # --ignore-scripts runs no package's install script: a package's code runs only when the build or a test loads it.
      # .npmrc's engine-strict stops an npm older than the one package.json asks for.
      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts
      - name: Check the decision index
        run: ./.template/Test-AdrIndex.ps1
      # Biome's formatter and linter, with the rules in biome.json (ADR-0201).
      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint
      - name: Build
        if: hashFiles('package.json') != ''
        run: |
          npm run build
      # The browser check loads the built site in headless Chromium. playwright-core is locked like every other package
      # and names the one Chromium build it drives: this runs its own command from node_modules, never a package npx
      # would fetch, to download that build, and --with-deps installs the system libraries the build needs from the
      # runner's Ubuntu archive. Nothing is cached, so each run downloads the build the locked playwright-core names.
      - name: Install the browser the tests use
        if: hashFiles('package.json') != ''
        run: npm run browser -- --with-deps
      - name: Test
        if: hashFiles('package.json') != ''
        env:
          # Without it the browser check is skipped where the browser does not start; with it that is a failure.
          DOCS_REQUIRE_BROWSER: '1'
        run: |
          npm run test
